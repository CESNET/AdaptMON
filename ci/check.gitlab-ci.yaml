---
commitlint:
  stage: check
  needs: []
  image:
    name: registry.hub.docker.com/commitlint/commitlint:latest
    entrypoint: [""]
  script:
    # Uncomment the next line if you are extending the @commitlint/config-nx-scopes in your commitlint configuration
    # - npm i -g nx@$(node -pe "require('./package.json').devDependencies.nx")
    - commitlint --from ${CI_MERGE_REQUEST_DIFF_BASE_SHA} --to ${CI_COMMIT_SHA}
  rules:
    - if: $CI_MERGE_REQUEST_DIFF_BASE_SHA

editorconfig:
  stage: check
  needs: []
  image: mstruebing/editorconfig-checker
  script:
    - "ec -disable-indent-size" # incompatible with the way clang-format indents things

.check:
  stage: check
  needs:
    - docker [Oracle Linux 10]
  image: $DOCKER_IMAGE:$DOCKER_TAG
  cache:
    - key: cache-$DOCKER_IMAGE:$DOCKER_TAG
      paths:
        - build/_deps
  variables:
    OS_DISTRO: "oraclelinux"
    OS_RELEASE: "10"
    DOCKER_TAG: "ol10"

clang-tidy:
  extends: .check
  script:
    - "make tidy"

clang-format:
  extends: .check
  script:
    - "make format"

atomic-commits:
  extends: .check
  script:
    - git rev-list --reverse ${CI_MERGE_REQUEST_DIFF_BASE_SHA}..HEAD | xargs -n1 -I{} sh -c "git checkout {} && make"
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  rules:
    - if: $CI_MERGE_REQUEST_DIFF_BASE_SHA

doxygen:
  stage: check
  script:
    - "make doxygen-strict"
  artifacts:
    paths: [build/doc/doxygen/html]
    expire_in: 1 week
