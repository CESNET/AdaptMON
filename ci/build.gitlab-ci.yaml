---
.build:
  stage: build
  image: $DOCKER_IMAGE:$DOCKER_TAG
  script:
    - "make debug-build-strict"
  cache:
    - key: cache-$DOCKER_IMAGE:$DOCKER_TAG
      paths:
        - /builds/monitoring/adaptmon/build/_deps/

build [Oracle Linux 8]:
  extends: .build
  variables: { DOCKER_TAG: ol8 }
  needs:
    - docker [Oracle Linux 8]

build [Oracle Linux 9]:
  extends: .build
  variables: { DOCKER_TAG: ol9 }
  needs:
    - docker [Oracle Linux 9]

build [Oracle Linux 10]:
  extends: .build
  variables: { DOCKER_TAG: ol10 }
  needs:
    - docker [Oracle Linux 10]
