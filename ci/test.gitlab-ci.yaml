---
test:
  stage: test
  needs:
    - "build [Oracle Linux 10]"
  variables:
    DOCKER_TAG: ol10
  image: $DOCKER_IMAGE:$DOCKER_TAG
  script:
    - "make coverage"
  coverage: '/^TOTAL.*\s+(\d+\.?\d*%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage.xml
    paths:
      - build/coverage-html/
    expire_in: 1w

pytest:
  stage: test
  needs:
    - "build [Oracle Linux 10]"
  variables:
    DOCKER_TAG: ol10
  image: $DOCKER_IMAGE:$DOCKER_TAG
  script:
    - "make pytest"
